# .github/workflows/sync.yml
name: Multi-Source Sync & Purge CDN

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync_multi_sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update && sudo apt-get install -y rsync jq
          pip install tccli

      - name: Configure TencentCloud CLI
        if: ${{ env.EDGEONE_ZONE_ID != '' && secrets.TENCENT_SECRET_ID != '' }}
        run: |
          tccli configure set secretId ${{ secrets.TENCENT_SECRET_ID }}
          tccli configure set secretKey ${{ secrets.TENCENT_SECRET_KEY }}
          tccli configure set region ap-guangzhou

      - name: Sync Multiple Sources
        run: |
          # ==========================================================
          # 【多任务配置区域】⚠️ 请勿手动修改格式，供 append-sync-config.yml 解析
          # === SYNC_CONFIG_START ===
          SYNC_TASKS='[
            {
              "source_repo": "lingeringsound/adblock_auto",
              "source_branch": "main",
              "source_path": "Rules",
              "dest_path": "adblock_auto/Rules"
            }
          ]'
          # === SYNC_CONFIG_END ===
          # ==========================================================

          # 配置 Git（✅ 修复：去掉字符串末尾空格）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 解析 JSON 并循环处理每个任务
          echo "$SYNC_TASKS" | jq -c '.[]' | while read -r task; do
            # 读取配置（✅ 修复：jq key 去掉末尾空格）
            SRC_REPO=$(echo "$task" | jq -r '.source_repo')
            SRC_BRANCH=$(echo "$task" | jq -r '.source_branch')
            SRC_PATH=$(echo "$task" | jq -r '.source_path')
            DEST_PATH=$(echo "$task" | jq -r '.dest_path')
            
            echo "------------------------------------------------"
            echo "▶ 开始同步任务:"
            echo "  源: $SRC_REPO ($SRC_BRANCH) -> $SRC_PATH"
            echo "  目标: $DEST_PATH"
            
            # 生成唯一临时目录（✅ 修复：= 后面不能有空格）
            TEMP_DIR="/tmp/sync_$(echo "$SRC_REPO" | md5sum | head -c 10)"
            
            # 克隆源仓库 (稀疏检出)
            rm -rf "$TEMP_DIR"
            git clone --depth 1 --branch "$SRC_BRANCH" --filter=blob:none --sparse "https://github.com/$SRC_REPO" "$TEMP_DIR"
            
            # 设置稀疏检出路径
            pushd "$TEMP_DIR" > /dev/null
            git sparse-checkout set --no-cone "$SRC_PATH"
            popd > /dev/null
            
            # 检查源文件是否存在
            if [ ! -e "$TEMP_DIR/$SRC_PATH" ]; then
              echo "::error:: ❌ 错误：源路径 '$SRC_PATH' 不存在"
              exit 1
            fi

            # 准备目标目录
            mkdir -p "$DEST_PATH"
            
            # 同步逻辑
            if [ -d "$TEMP_DIR/$SRC_PATH" ]; then
              echo "  类型: 文件夹同步"
              rsync -av --delete "$TEMP_DIR/$SRC_PATH/" "$DEST_PATH/"
            else
              echo "  类型: 单文件同步"
              PARENT_DIR=$(dirname "$DEST_PATH")
              mkdir -p "$PARENT_DIR"
              rsync -av --delete "$TEMP_DIR/$SRC_PATH" "$DEST_PATH"
            fi
            
            # 清理
            rm -rf "$TEMP_DIR"
          done

          echo "------------------------------------------------"
          echo "▶ 检查并提交变更..."
          
          # 只 add 配置中指定的路径
          echo "$SYNC_TASKS" | jq -r '.[].dest_path' | while read -r path; do
            if [ -f "$path" ] || [ -d "$path" ]; then
              git add "$path"
            fi
          done

          if ! git diff --cached --quiet; then
            echo "💾 发现变更，提交中..."
            git commit -m "chore: sync updates from upstream sources"
            git push
            echo "✅ 同步完成"
          else
            echo "✅ 无变更，跳过提交"
          fi

      - name: Purge EdgeOne CDN Cache
        if: success() && env.EDGEONE_ZONE_ID != '' && secrets.TENCENT_SECRET_ID != ''
        run: |
          echo "🧹 清除 EdgeOne CDN 缓存..."
          
          # 读取配置（支持 secrets/vars 覆盖）
          ZONE_ID="${{ secrets.EDGEONE_ZONE_ID }}"
          PURGE_TYPE="${{ vars.EDGEONE_PURGE_TYPE || 'purge_prefix' }}"
          PURGE_TARGETS="${{ secrets.EDGEONE_PURGE_TARGETS || '[\"https://your-domain.com/\"]' }}"
          PURGE_METHOD="${{ vars.EDGEONE_PURGE_METHOD || 'delete' }}"
          
          if [ -z "$ZONE_ID" ]; then
            echo "⚠️ 未配置 EDGEONE_ZONE_ID，跳过"
            exit 0
          fi
          
          RESPONSE=$(tccli teo CreatePurgeTask \
            --ZoneId "$ZONE_ID" \
            --Type "$PURGE_TYPE" \
            --Targets "$PURGE_TARGETS" \
            --Method "$PURGE_METHOD" \
            --cli-unfold-argument 2>&1)
          
          if echo "$RESPONSE" | jq -e '.TaskId' > /dev/null 2>&1; then
            TASK_ID=$(echo "$RESPONSE" | jq -r '.TaskId')
            echo "✅ CDN 刷新成功！TaskId: $TASK_ID"
          else
            echo "⚠️ CDN 刷新响应: $RESPONSE"
          fi
